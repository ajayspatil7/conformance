[project]
name = "conformance"
version = "0.1.0"
description = "Tests whether inference providers serve an open-weight model correctly."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "typer>=0.12",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "jsonschema>=4.21",
]

[project.scripts]
cprobe = "conformance_probe.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5", "types-PyYAML"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/conformance_probe"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
