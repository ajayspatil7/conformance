# Sampling follows the official non-thinking settings; thinking disabled to isolate the tool parser.
cases:
  - id: should-call-weather
    kind: should_call
    description: Clear request that needs the weather tool.
    messages:
      - {role: user, content: "What's the weather in Paris right now?"}
    tools: &tools
      - type: function
        function:
          name: get_weather
          description: Get current weather for a city.
          parameters:
            type: object
            properties:
              city: {type: string}
              unit: {type: string, enum: [celsius, fahrenheit]}
            required: [city]
      - type: function
        function:
          name: get_time
          description: Get the current local time for an IANA timezone.
          parameters:
            type: object
            properties:
              timezone: {type: string}
            required: [timezone]
    params: &p
      max_tokens: 512
      temperature: 0.7
      top_p: 0.8
      top_k: 20
      presence_penalty: 1.5
      chat_template_kwargs: {enable_thinking: false}
    expect: {should_call: true, tool: get_weather}

  - id: should-not-call-arithmetic
    kind: should_not_call
    description: Trivial question that needs no tool.
    messages:
      - {role: user, content: "What is 17 + 25? Answer with just the number."}
    tools: *tools
    params: *p
    expect: {should_call: false}

  - id: choose-time-tool
    kind: choose_among
    description: Two tools offered; only get_time fits.
    messages:
      - {role: user, content: "What time is it in Asia/Tokyo?"}
    tools: *tools
    params: *p
    expect: {should_call: true, tool: get_time}

  - id: continuation-after-tool-result
    kind: continuation
    description: Tool result is supplied; the model should answer in text, not call again.
    messages:
      - {role: user, content: "What's the weather in Paris right now?"}
      - role: assistant
        content: null
        tool_calls:
          - id: call_1
            type: function
            function: {name: get_weather, arguments: '{"city": "Paris"}'}
      - {role: tool, tool_call_id: call_1, content: '{"temp_c": 18, "sky": "cloudy"}'}
    tools: *tools
    params: *p
    expect: {should_call: false}
