# Thinking-mode sampling: temperature=1.0, top_p=0.95, top_k=20 (official).
# `reasoning_effort` is sent as-is; OpenRouter may normalise it, direct endpoints pass it through.
cases:
  - id: effort-low
    kind: effort
    messages: &q
      - {role: user, content: "A train leaves at 3:15pm and arrives at 6:40pm. How many minutes is the trip?"}
    params:
      max_tokens: 4096
      temperature: 1.0
      top_p: 0.95
      top_k: 20
      reasoning_effort: low
    expect: {thinking: true}

  - id: effort-medium
    kind: effort
    messages: *q
    params:
      max_tokens: 4096
      temperature: 1.0
      top_p: 0.95
      top_k: 20
      reasoning_effort: medium
    expect: {thinking: true}

  - id: effort-xhigh
    kind: effort
    messages: *q
    params:
      max_tokens: 8192
      temperature: 1.0
      top_p: 0.95
      top_k: 20
      reasoning_effort: xhigh
    expect: {thinking: true}

  - id: thinking-disabled
    kind: thinking_off
    description: enable_thinking=false must yield zero reasoning tokens.
    messages: *q
    params:
      max_tokens: 1024
      temperature: 0.7
      top_p: 0.8
      top_k: 20
      presence_penalty: 1.5
      chat_template_kwargs: {enable_thinking: false}
    expect: {thinking: false}
